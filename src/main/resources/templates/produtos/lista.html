<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Gestão de Produtos</h2>
        <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#formularioProduto">Novo Produto</button>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}" role="alert"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}" role="alert"></div>
    <div class="collapse mb-3" th:classappend="${abrirCadastro == true} ? 'show'" id="formularioProduto">
        <div class="card shadow-sm"><div class="card-body">
            <form th:action="@{/produtos}" th:object="${produto}" method="post">
                <div th:replace="~{produtos/produto-form :: campos}"></div>
                <div class="d-flex justify-content-end"><button type="submit" class="btn btn-success">Salvar</button></div>
            </form>
        </div></div>
    </div>
    <div class="card shadow-sm"><div class="card-body p-0 table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark"><tr>
                <th scope="col" class="ps-4">Nome</th><th scope="col">Tipo</th>
                <th scope="col">Preço</th><th scope="col">Status</th>
                <th scope="col" class="text-end pe-4">Ações</th>
            </tr></thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td></tr>
                <tr th:each="item : ${produtos}">
                    <td class="ps-4" th:text="${item.nome}"></td>
                    <td th:text="${item.tipo}"></td>
                    <td th:text="${item.preco != null ? 'R$ ' + #numbers.formatDecimal(item.preco, 1, 'POINT', 2, 'COMMA') : 'Não informado'}"></td>
                    <td><span class="badge" th:classappend="${item.ativo == true} ? 'bg-success' : 'bg-secondary'"
                              th:text="${item.ativo == true} ? 'ATIVO' : 'INATIVO'"></span></td>
                    <td class="text-end pe-4">
                        <a th:href="@{/produtos/editar/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary me-1">Editar</a>
                        <form th:action="@{/produtos/{id}/status(id=${item.id})}" method="post" class="d-inline">
                            <input type="hidden" name="ativo" th:value="${item.ativo != true}">
                            <button type="submit" class="btn btn-sm me-1" th:classappend="${item.ativo == true} ? 'btn-outline-danger' : 'btn-outline-success'"
                                    th:text="${item.ativo == true} ? 'Desativar' : 'Ativar'"></button>
                        </form>
                        <form th:action="@{/produtos/{id}/excluir(id=${item.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Tem certeza que deseja excluir este produto? A exclusão é definitiva e só é permitida se ele não foi utilizado em pedidos.')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>
