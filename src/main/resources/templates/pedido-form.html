<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm" aria-label="Voltar para pedidos">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag-plus me-2 text-primary"></i>Novo Pedido
        </h2>
    </div>

    <div class="alert alert-danger" th:if="${erro}" role="alert" th:text="${erro}"></div>

    <div class="card shadow-sm" style="max-width: 760px;">
        <div class="card-body p-4">
            <form th:action="@{/pedidos/novo}" method="post">
                <div class="mb-3">
                    <label for="clienteId" class="form-label fw-medium">Cliente</label>
                    <select id="clienteId" name="clienteId" class="form-select" required>
                        <option value="" selected disabled>Selecione um cliente</option>
                        <option th:each="cliente : ${clientes}"
                                th:value="${cliente.id}"
                                th:text="|${cliente.nome} — ${cliente.telefone}|"></option>
                    </select>
                    <div class="form-text" th:if="${#lists.isEmpty(clientes)}">
                        Cadastre um cliente antes de criar o pedido.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Itens do pedido</label>
                    <div id="itensPedido" class="d-flex flex-column gap-2">
                        <div class="item-pedido row g-2 align-items-center">
                            <div class="col-md-8">
                                <select name="produtoIds" class="form-select" required>
                                    <option value="" selected disabled>Selecione um produto</option>
                                    <option th:each="produto : ${produtos}"
                                            th:value="${produto.id}"
                                            th:text="|${produto.nome} — R$ ${produto.preco}|"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="number" name="quantidades" class="form-control"
                                       min="1" step="1" value="1" required aria-label="Quantidade">
                            </div>
                            <div class="col-md-1">
                                <button type="button" class="btn btn-outline-danger remover-item"
                                        aria-label="Remover item" disabled>
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" id="adicionarItem" class="btn btn-outline-primary btn-sm mt-2">
                        <i class="bi bi-plus-lg me-1"></i>Adicionar produto
                    </button>
                    <div class="form-text" th:if="${#lists.isEmpty(produtos)}">
                        Cadastre um produto antes de criar o pedido.
                    </div>
                </div>

                <div class="mb-4" th:if="${podeAplicarDesconto}">
                    <label for="descontoPercentual" class="form-label fw-medium">Desconto (%)</label>
                    <input type="number" id="descontoPercentual" name="descontoPercentual"
                           class="form-control" min="0" max="100" step="0.01" value="0">
                    <div class="form-text">O valor final será calculado pelo servidor.</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:disabled="${#lists.isEmpty(clientes) or #lists.isEmpty(produtos)}">
                        <i class="bi bi-check-lg me-1"></i>Criar Pedido
                    </button>
                    <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const itensPedido = document.getElementById('itensPedido');
        document.getElementById('adicionarItem').addEventListener('click', () => {
            const novoItem = itensPedido.querySelector('.item-pedido').cloneNode(true);
            novoItem.querySelector('select').selectedIndex = 0;
            novoItem.querySelector('input').value = 1;
            itensPedido.appendChild(novoItem);
            atualizarBotoesRemover();
        });

        itensPedido.addEventListener('click', event => {
            const botaoRemover = event.target.closest('.remover-item');
            if (botaoRemover && itensPedido.querySelectorAll('.item-pedido').length > 1) {
                botaoRemover.closest('.item-pedido').remove();
                atualizarBotoesRemover();
            }
        });

        function atualizarBotoesRemover() {
            const botoes = itensPedido.querySelectorAll('.remover-item');
            botoes.forEach(botao => botao.disabled = botoes.length === 1);
        }
    </script>
</div>

</body>
</html>
