<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Administrativo · Pediu Patrão</title>
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light" aria-label="Cabeçalho administrativo">
        <ul class="navbar-nav"><li class="nav-item"><button class="nav-link btn btn-link" data-widget="pushmenu" type="button" aria-label="Abrir ou recolher menu"><i class="fas fa-bars" aria-hidden="true"></i></button></li>
            <li class="nav-item d-none d-sm-inline-block"><a class="nav-link" th:href="@{/}">Início</a></li></ul>
        <div class="ml-auto text-sm mr-3"><i class="fas fa-user-shield mr-2" aria-hidden="true"></i><span th:text="${administrador}"></span><span class="badge badge-success ml-2">Administrador</span></div>
    </nav>
    <aside class="main-sidebar sidebar-dark-success elevation-3" aria-label="Menu administrativo">
        <a th:href="@{/dashboard}" class="brand-link"><i class="fas fa-pizza-slice ml-3 mr-2" aria-hidden="true"></i><span class="brand-text font-weight-light">Pediu <strong>Patrão</strong></span></a>
        <div class="sidebar"><div class="user-panel mt-3 pb-3 mb-3 d-flex"><div class="info"><span class="d-block text-white">Administração</span><small class="text-muted">Gestão e acompanhamento</small></div></div>
            <nav aria-label="Navegação principal"><ul class="nav nav-pills nav-sidebar flex-column" role="menu">
                <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}" aria-current="page"><i class="nav-icon fas fa-chart-line" aria-hidden="true"></i><p>Dashboard</p></a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pedidos}"><i class="nav-icon fas fa-receipt" aria-hidden="true"></i><p>Pedidos</p></a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/produtos}"><i class="nav-icon fas fa-box" aria-hidden="true"></i><p>Produtos</p></a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}"><i class="nav-icon fas fa-users" aria-hidden="true"></i><p>Usuários</p></a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/auditoria}"><i class="nav-icon fas fa-history" aria-hidden="true"></i><p>Auditoria</p></a></li>
            </ul></nav>
            <form method="post" th:action="@{/logout}" class="mt-4"><button type="submit" class="btn btn-outline-light btn-block"><i class="fas fa-sign-out-alt mr-2" aria-hidden="true"></i>Sair</button></form>
        </div>
    </aside>
    <main class="content-wrapper"><div th:replace="~{dashboard :: content}"></div></main>
    <footer class="main-footer text-sm"><strong>Pediu Patrão</strong><span class="float-right d-none d-sm-inline">Dashboard Administrativo · AdminLTE 3.2.0</span></footer>
</div>
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>
<script th:src="@{/plugins/chart.js/Chart.min.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body></html>
