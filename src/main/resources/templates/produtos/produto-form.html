<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h2 class="fw-bold mb-4">Editar Produto</h2>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}" role="alert"></div>
    <div class="card shadow-sm"><div class="card-body">
        <form th:action="@{/produtos/editar/{id}(id=${produto.id})}" th:object="${produto}" method="post">
            <div th:replace="~{produtos/produto-form :: campos}"></div>
            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>
        </form>
    </div></div>
</div>
<div th:fragment="campos">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome do Produto</label>
        <input type="text" id="nome" th:field="*{nome}" class="form-control" maxlength="150" required>
    </div>
    <div class="mb-3">
        <label for="tipo" class="form-label">Tipo do Produto</label>
        <select id="tipo" th:field="*{tipo}" class="form-select" required>
            <option value="" disabled>Selecione o Tipo</option>
            <option th:each="tipoProduto : ${tiposProduto}" th:value="${tipoProduto}" th:text="${tipoProduto}"></option>
        </select>
    </div>
    <div class="mb-3">
        <label for="preco" class="form-label">Preço (R$)</label>
        <input type="number" id="preco" th:field="*{preco}" class="form-control" min="0" step="0.01" required>
    </div>
    <div class="form-check mb-3">
        <input type="checkbox" id="ativo" th:field="*{ativo}" class="form-check-input">
        <label for="ativo" class="form-check-label">Produto Ativo</label>
    </div>
</div>
</body>
</html>
